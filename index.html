<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Piket Keterlambatan SMKNW</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
    }
   .card {
      border: none;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }
   .btn-primary {
      background-color: #2563eb;
      border: none;
      padding: 12px;
      font-weight: 600;
      border-radius: 8px;
      transition: all 0.3s;
    }
   .btn-primary:hover {
      background-color: #1d4ed8;
      transform: translateY(-2px);
    }
   .btn-primary:disabled {
      background-color: #93c5fd;
    }
  </style>
</head>
<body>

<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card p-4 p-md-5">
        <h3 class="text-center fw-bold mb-1">PIKET KETERLAMBATAN</h3>
        <p class="text-center text-muted mb-4">SMKN 1 Wongsorejo 2026</p>
        
        <form id="formTerlambat">
          <!-- Pilih Kelas -->
          <div class="mb-3">
            <label for="kelas" class="form-label fw-semibold">1. Pilih Kelas</label>
            <select id="kelas" class="form-select" required disabled>
              <option value="">-- Memuat Data Kelas... --</option>
            </select>
          </div>

          <!-- Pilih Nama -->
          <div class="mb-3">
            <label for="nama" class="form-label fw-semibold">2. Pilih Nama Siswa</label>
            <select id="nama" class="form-select" required disabled>
              <option value="">-- Pilih Kelas Terlebih Dahulu --</option>
            </select>
          </div>

          <!-- Alasan -->
          <div class="mb-4">
            <label for="alasan" class="form-label fw-semibold">3. Alasan Keterlambatan</label>
            <select id="alasan" class="form-select" required>
              <option value="">-- Pilih Alasan --</option>
              <option value="Bangun Kesiangan">Bangun Kesiangan</option>
              <option value="Ban Bocor / Kendala Kendaraan">Ban Bocor / Kendala Kendaraan</option>
              <option value="Macet Di Jalan">Macet Di Jalan</option>
              <option value="Keperluan Keluarga">Keperluan Keluarga</option>
              <option value="Hujan Deras">Hujan Deras</option>
              <option value="Lainnya">Lainnya</option>
            </select>
          </div>

          <!-- Tombol Submit -->
          <button type="submit" id="btnSimpan" class="btn btn-primary w-100">Simpan Keterlambatan</button>
        </form>

        <div id="pesan" class="mt-3 text-center fw-semibold"></div>
      </div>
      <p class="text-center text-white mt-3 small">Data otomatis masuk ke Google Sheet</p>
    </div>
  </div>
</div>

<script>
  // ===============================================
  // PENTING: GANTI DENGAN URL WEB APP KAMU
  // ===============================================
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxhMwuRUpC_n_Senp3ygrLz_2du7mGPltcrWuVkWcDW3xx1S5VJOxXVIIwiBeGyZJ2uHw/exec"; 

  let dataSiswaGlobal = [];

  // Fungsi Callback untuk JSONP
  function prosesDataSiswa(response) {
    const selectKelas = document.getElementById('kelas');
    
    if (!response || response.length === 0 || response[0] === "error") {
      selectKelas.innerHTML = '<option value="">❌ Gagal Memuat Data</option>';
      return;
    }

    dataSiswaGlobal = response;

    // Ambil daftar kelas unik dari kolom A
    const daftarKelas = [...new Set(response.map(row => row[0]))].filter(Boolean);
    daftarKelas.sort();

    // Isi dropdown Kelas
    selectKelas.innerHTML = '<option value="">-- Pilih Kelas --</option>';
    daftarKelas.forEach(kelas => {
      const opt = document.createElement('option');
      opt.value = kelas;
      opt.textContent = kelas;
      selectKelas.appendChild(opt);
    });

    selectKelas.disabled = false;
  }

  // Panggil data via JSONP
  function muatData() {
    const script = document.createElement('script');
    script.src = SCRIPT_URL + "?callback=prosesDataSiswa";
    script.onerror = function() {
      document.getElementById('kelas').innerHTML = '<option value="">❌ Gagal Memuat Data</option>';
    };
    document.body.appendChild(script);
  }

  // Event saat Pilih Kelas berubah
  document.getElementById('kelas').addEventListener('change', function() {
    const kelasTerpilih = this.value;
    const selectNama = document.getElementById('nama');

    if (!kelasTerpilih) {
      selectNama.innerHTML = '<option value="">-- Pilih Kelas Terlebih Dahulu --</option>';
      selectNama.disabled = true;
      return;
    }

    // Filter nama berdasarkan kelas dari kolom B
    const siswaFilter = dataSiswaGlobal
     .filter(row => row[0] === kelasTerpilih)
     .map(row => row[1])
     .filter(Boolean);

    siswaFilter.sort();

    selectNama.innerHTML = '<option value="">-- Pilih Nama Siswa --</option>';
    siswaFilter.forEach(nama => {
      const opt = document.createElement('option');
      opt.value = nama;
      opt.textContent = nama;
      selectNama.appendChild(opt);
    });

    selectNama.disabled = false;
  });

  // Submit Form
  document.getElementById('formTerlambat').addEventListener('submit', function(e) {
    e.preventDefault();

    const btn = document.getElementById('btnSimpan');
    const pesan = document.getElementById('pesan');

    const payload = {
      waktu: new Date().toLocaleString('id-ID', { timeZone: 'Asia/Jakarta' }),
      kelas: document.getElementById('kelas').value,
      nama: document.getElementById('nama').value,
      alasan: document.getElementById('alasan').value
    };

    btn.disabled = true;
    btn.textContent = 'Menyimpan...';
    pesan.textContent = '';

    fetch(SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    })
   .then(res => res.json())
   .then(res => {
      if(res.status === "success"){
        pesan.style.color = 'green';
        pesan.textContent = '✅ Data Keterlambatan Berhasil Disimpan!';
        document.getElementById('formTerlambat').reset();
        document.getElementById('nama').innerHTML = '<option value="">-- Pilih Kelas Terlebih Dahulu --</option>';
        document.getElementById('nama').disabled = true;
      } else {
        throw new Error(res.message)
      }
    })
   .catch(err => {
      pesan.style.color = 'red';
      pesan.textContent = '❌ Gagal menyimpan data: ' + err;
    })
   .finally(() => {
      btn.disabled = false;
      btn.textContent = 'Simpan Keterlambatan';
    });
  });

  // Jalankan pemanggilan data saat halaman selesai di-load
  window.onload = muatData;
</script>

</body>
</html>
