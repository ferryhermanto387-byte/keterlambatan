<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Piket Keterlambatan SMKNW</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #f1f5f9; padding: 15px; margin: 0; }
    .card { max-width: 480px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    h2 { text-align: center; color: #1e293b; margin-top: 0; }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-weight: 600; margin-bottom: 5px; color: #475569; }
    select, input { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; font-size: 1rem; }
    button { width: 100%; padding: 14px; background: #2563eb; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; }
    button:disabled { background: #94a3b8; cursor: not-allowed; }
    .status { text-align: center; margin-top: 15px; font-weight: bold; }
  </style>
</head>
<body>

<div class="card">
  <h2>Piket Keterlambatan SMKNW</h2>
  <form id="piketForm">
    <div class="form-group">
      <label for="kelas">Pilih Kelas</label>
      <select id="kelas" required onchange="filterSiswa()">
        <option value="">-- Memuat Data Kelas... --</option>
      </select>
    </div>

    <div class="form-group">
      <label for="nama">Pilih Nama Siswa</label>
      <select id="nama" required disabled>
        <option value="">-- Pilih Kelas Terlebih Dahulu --</option>
      </select>
    </div>

    <div class="form-group">
      <label for="alasan">Alasan Keterlambatan</label>
      <select id="alasan" required>
        <option value="">-- Pilih Alasan --</option>
        <option value="Macet di Jalan">Macet di Jalan</option>
        <option value="Bangun Kesiangan">Bangun Kesiangan</option>
        <option value="Ban Motor Bocor / Mogok">Ban Motor Bocor / Mogok</option>
        <option value="Hujan Deras">Hujan Deras</option>
        <option value="Lainnya">Lainnya</option>
      </select>
    </div>

    <button type="submit" id="btnSubmit">Simpan Keterlambatan</button>
  </form>
  <div id="status" class="status"></div>
</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxHMwuRUPc_n_Senp3ygrLz_2du7mGPItcrWuVkWcDW3xx1S5VJOxXVIIwiBeGyZJ2uHw/exec";
  
  let masterData = [];

  // Ambil data siswa dari Google Sheets (metode redirect fetch)
  window.onload = function() {
    fetch(SCRIPT_URL)
      .then(res => res.json())
      .then(data => {
        masterData = data;
        populateKelas();
      })
      .catch(err => {
        console.error(err);
        document.getElementById('kelas').innerHTML = '<option value="">❌ Gagal Memuat Data</option>';
        document.getElementById('status').innerText = "❌ Gagal terhubung ke Google Sheets.";
      });
  };

  function populateKelas() {
    const kelasSelect = document.getElementById('kelas');
    
    // Kolom B adalah index 1 (Kelas)
    const daftarKelas = [...new Set(masterData.map(item => item[1]))].filter(Boolean).sort();
    
    kelasSelect.innerHTML = '<option value="">-- Pilih Kelas --</option>';
    daftarKelas.forEach(kelas => {
      kelasSelect.innerHTML += `<option value="${kelas}">${kelas}</option>`;
    });
  }

  function filterSiswa() {
    const kelasTerpilih = document.getElementById('kelas').value;
    const namaSelect = document.getElementById('nama');
    
    if (!kelasTerpilih) {
      namaSelect.innerHTML = '<option value="">-- Pilih Kelas Terlebih Dahulu --</option>';
      namaSelect.disabled = true;
      return;
    }

    // Filter siswa berdasarkan kelas (item[1] = Kelas, item[0] = Nama Siswa)
    const siswaFiltered = masterData.filter(item => item[1] === kelasTerpilih);
    
    namaSelect.innerHTML = '<option value="">-- Pilih Nama Siswa --</option>';
    siswaFiltered.forEach(item => {
      namaSelect.innerHTML += `<option value="${item[0]}">${item[0]}</option>`;
    });
    namaSelect.disabled = false;
  }

  document.getElementById('piketForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const btn = document.getElementById('btnSubmit');
    const status = document.getElementById('status');
    
    btn.disabled = true;
    status.style.color = "#2563eb";
    status.innerText = "⏳ Menyimpan ke Google Sheets...";

    const payload = {
      waktu: new Date().toLocaleString('id-ID'),
      kelas: document.getElementById('kelas').value,
      nama: document.getElementById('nama').value,
      alasan: document.getElementById('alasan').value
    };

    fetch(SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    }).then(() => {
      status.style.color = "#16a34a";
      status.innerText = "✅ Data Berhasil Disimpan!";
      document.getElementById('piketForm').reset();
      document.getElementById('nama').disabled = true;
      btn.disabled = false;
    }).catch(() => {
      status.style.color = "#dc2626";
      status.innerText = "❌ Gagal Menyimpan.";
      btn.disabled = false;
    });
  });
</script>

</body>
</html>
